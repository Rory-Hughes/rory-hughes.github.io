          - region [ref=e291]:
            - heading "Protected storage and useful audit evidence" [level=2] [ref=e292]
            - paragraph [ref=e293]: Windows DPAPI protects local documents for the current Windows user. The implementation uses fresh entropy and clears temporary cryptographic buffers in finally blocks. Audit events use opaque identifiers and record authority, scope, and purpose rather than copying participant content.
            - paragraph [ref=e294]: The audit store takes a single-writer file lease. If persistence fails, it restores the prior in-memory event list so memory does not claim that failed writes reached disk. The design makes failure behavior part of the storage contract.
