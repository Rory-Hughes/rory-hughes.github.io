          - region [ref=e110]:
            - paragraph [ref=e111]: Overview
            - heading "The problem" [level=2] [ref=e112]
            - paragraph [ref=e113]: Housing-program teams working across disconnected sites need to coordinate program definitions and eventually return participant information to a main office. Sensitive information and unreliable connectivity make local storage, explicit trust, and controlled file exchange central design concerns.
          - region [ref=e114]:
            - heading "From an operational problem to a buildable system" [level=2] [ref=e115]
            - paragraph [ref=e116]: The project is for the John Howard Society of Saint John. Main Office and House staff have different responsibilities, and the intended workflow must operate without an always-on service. I translated stakeholder discussions and mockups into requirements, workflow states, architecture decisions, and testable acceptance criteria.
            - paragraph [ref=e117]: "That work connects product thinking to implementation: establish who needs to do what, make the trust boundaries explicit, and distinguish a proposed workflow from something the application can demonstrate."
          - region [ref=e118]:
            - heading "Two applications, one shared core" [level=2] [ref=e119]
            - paragraph [ref=e120]: The Main Office Admin console and House Program app are separate WPF applications. Neither shell references the other; a test enforces that separation. Five shared libraries hold presentation logic, application use cases, domain rules, infrastructure, and the transfer protocol.
            - paragraph [ref=e121]: Authorization and storage rules live beneath the screens. The domain holds invariants; application services make capability and session decisions; infrastructure supplies protected storage; the transfer library validates signed, encrypted files. Both interfaces use these shared rules.
            - list [ref=e122]:
              - listitem [ref=e123]: "Main Office: administrative workspaces, House directory, projects, and program-authoring tools."
              - listitem [ref=e124]: "House: its own installation identity, workspace security, and program-package review and activation foundations."
              - listitem [ref=e125]: "Exchange: manually moved files with recipient binding and operator-confirmed signing trust."
