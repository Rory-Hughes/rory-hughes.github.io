          - region [ref=e374]:
            - heading "Keeping engineering context honest" [level=2] [ref=e375]
            - paragraph [ref=e376]: I maintain repository guidance for AI-assisted development that records architecture decisions, known defects, verification commands, and lessons from earlier incorrect claims. It helps keep new changes consistent and makes decisions that are adopted but not built visible.
            - paragraph [ref=e377]: One documented negative control removed the UI-test parallelization setting, rebuilt, and observed the control test fail because the expected assembly attribute was missing. The setting was then restored. This checks that the test detects the fault it is intended to catch; it is separate from the incomplete UI-suite execution recorded on October 7.
            - paragraph [ref=e378]: The accompanying synthetic-data recording demonstrates the current Main Office authoring workflow and House setup. The next steps are to finish review and acceptance of the administration work and complete the remaining program and reporting journeys. The architecture described here supports that direction; it is not a claim that every planned capability is implemented.
          - region [ref=e379]:
            - paragraph [ref=e380]: Verification
            - heading "Engineering evidence" [level=2] [ref=e381]
            - list [ref=e382]:
              - listitem [ref=e383]: An 80-second synthetic-data walkthrough shows program authoring, reusable fields, reporting cadence, House assignment, form preview, publication, and House setup.
              - listitem [ref=e384]: "Approved October 7, 2026 report: six executed suites, 1,148 passing cases; two additional UI suites list 130 cases without a completed run."
              - listitem [ref=e385]: Four passing end-to-end tests exercise the provisioning/trust chain from blank state with real cryptography and SQLite.
              - listitem [ref=e386]: A test enforces that the two WPF shells do not reference one another.
              - listitem [ref=e387]: Workspace entry, lock, protected recovery, and audit are complete. Administration and authoring contain accepted work, implementation under review, and remaining backlog; participant and reporting journeys remain planned.
          - region [ref=e388]:
            - heading "Limitations & remaining work" [level=2] [ref=e389]
            - list [ref=e390]:
              - listitem [ref=e391]: Participant management, recurring submissions, the full data-return workflow, aggregate reporting, retention, and rollout remain planned work.
              - listitem [ref=e392]: The October 7 verification report describes a modified working tree. Its measurements are a dated development snapshot, not results tied to a clean published commit.
              - listitem [ref=e393]: The two UI-automation suites were not fully executed in that report. Narrator and 200% display-scale acceptance remain outstanding.
              - listitem [ref=e394]: Receipt manifests, atomic package commits, and a revised receipt format are architecture decisions awaiting implementation.
              - listitem [ref=e395]: No production deployment, live authentication/key-custody approval, or compliance assessment is claimed.
