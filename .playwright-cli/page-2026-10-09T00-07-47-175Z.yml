          - region [ref=e248]:
            - heading "Review, confirmation, and persistence are separate" [level=2] [ref=e249]
            - paragraph [ref=e250]: The program-data import service separates review, operator confirmation, and commit. Review and commit require different capabilities; commit refuses a missing review token or unconfirmed review. A generation counter prevents an older asynchronous review from replacing a newer one.
            - paragraph [ref=e251]: These are transfer-service foundations. The complete data-return application workflow, conflict-resolution screens, and receipt lifecycle are still backlog work; the existence of a service does not make that entire user journey finished.
