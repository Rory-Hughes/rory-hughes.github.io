              - heading "The problem" [level=2] [ref=f1e69]
            - paragraph [ref=f1e71]: I am exploring how a small computational model can make a research description of multicellular bioelectric interactions easier to reason about.
          - region [ref=f1e72]:
            - heading "Scope" [level=2] [ref=f1e74]
            - paragraph [ref=f1e76]: The executable learning model represents a chain of cells as passive electrical membranes coupled by gap junctions. It applies a current pulse and visualizes how membrane voltage changes and spreads over time. It does not simulate gene expression or protein transcription.
          - region [ref=f1e77]:
            - heading "Research reference and limits" [level=2] [ref=f1e79]
            - paragraph [ref=f1e81]: The project is informed by the cited paper but is not presented as a reproduction of its simulations or findings. No documented comparison, validated output, or reproduced result is claimed.
