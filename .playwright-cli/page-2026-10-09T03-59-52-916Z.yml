              - heading "Engineering evidence" [level=2] [ref=f1e250]
            - list [ref=f1e252]:
              - listitem [ref=f1e253]: The public repository implements a passive cell network in Python with NumPy, plus Euler and fourth-order Runge-Kutta integration.
              - listitem [ref=f1e254]: The test suite checks passive-cell behavior, pairwise gap-current symmetry, stimulus boundaries, and time-step endpoints; these internal checks do not compare results with the cited paper.
          - region [ref=f1e255]:
            - heading "Limitations & remaining work" [level=2] [ref=f1e257]
            - list [ref=f1e259]:
              - listitem [ref=f1e260]: No documented comparison with the paper's published results is available.
              - listitem [ref=f1e261]: No validated or reproduced scientific result is claimed.
              - listitem [ref=f1e262]: The current model is limited to passive membrane and gap-junction dynamics; ion-channel behavior, gene expression, cell mechanics, and morphogenesis are outside its scope.
