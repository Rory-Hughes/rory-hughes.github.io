              - listitem [ref=e261]: No validated or reproduced scientific result is claimed.
              - listitem [ref=e262]: The current model is limited to passive membrane and gap-junction dynamics; ion-channel behavior, gene expression, cell mechanics, and morphogenesis are outside its scope.
