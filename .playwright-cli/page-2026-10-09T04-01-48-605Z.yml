            - paragraph [ref=e71]: I am exploring how a small computational model can make a research description of multicellular bioelectric interactions easier to reason about.
          - region [ref=e72]:
            - heading "Scope" [level=2] [ref=e74]
            - paragraph [ref=e76]: The executable learning model represents a chain of cells as passive electrical membranes coupled by gap junctions. It applies a current pulse and visualizes how membrane voltage changes and spreads over time. It does not simulate gene expression or protein transcription.
          - region [ref=e77]:
