            - list [ref=e252]:
              - listitem [ref=e253]: The public repository implements a passive cell network in Python with NumPy, plus Euler and fourth-order Runge-Kutta integration.
              - listitem [ref=e254]: The test suite checks passive-cell behavior, pairwise gap-current symmetry, stimulus boundaries, and time-step endpoints; these internal checks do not compare results with the cited paper.
          - region [ref=e255]:
