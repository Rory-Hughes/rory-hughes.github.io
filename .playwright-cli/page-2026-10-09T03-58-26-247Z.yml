            - generic [ref=e361]: "# Passive membrane current balance"
            - generic [ref=e363]: The model keeps leak, gap-junction, and external current as separate components. It sums current flowing from coupled cells into each cell and divides the total by membrane capacitance to obtain the voltage derivative. This is the simulator's passive electrical model; it does not establish a biological or paper-reproduction result.
            - generic [ref=e365]: "Source: [model.py, lines 93–116](https://github.com/Rory-Hughes/simple-multicellular-bioelectric-simulator/blob/master/src/bioelectric_sim/model.py#L93-L116)"
            - generic [ref=e367]: ~~~python
            - generic [ref=e368]: "def gap_current_matrix_nA(self, voltage_mV: ArrayLike) -> FloatArray:"
            - generic [ref=e369]: "\"\"\"Return current into cell i from cell j at matrix position [i, j].\"\"\""
            - generic [ref=e371]: voltage = _vector("voltage_mV", voltage_mV, self.cell_count)
            - generic [ref=e372]: voltage_difference = voltage[np.newaxis, :] - voltage[:, np.newaxis]
            - generic [ref=e373]: return self.gap_conductance_uS * voltage_difference
            - generic [ref=e375]: def current_components(
            - generic [ref=e376]: "self, voltage_mV: ArrayLike, external_current_nA: ArrayLike | None = None"
