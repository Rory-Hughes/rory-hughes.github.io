            - generic [ref=e378]: "\"\"\"Calculate inward-positive leak, coupling, and applied currents.\"\"\""
            - generic [ref=e379]: voltage = _vector("voltage_mV", voltage_mV, self.cell_count)
            - generic [ref=e380]: external = (
