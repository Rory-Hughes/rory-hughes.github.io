        - generic [ref=f3e348]:
          - region [ref=f3e349]:
            - generic [ref=f3e350]:
              - paragraph [ref=f3e351]: Overview
              - heading "The problem" [level=2] [ref=f3e352]
            - paragraph [ref=f3e354]: Drivers need a dependable way to record trip details, organize mileage, and review information for their own records without losing sight of incomplete or unverified entries.
          - region [ref=f3e355]:
            - heading "The problem and my role" [level=2] [ref=f3e357]
            - generic [ref=f3e358]:
              - paragraph [ref=f3e359]: "Drivers need more than a distance total: trips need context, vehicles need accurate odometer records, and reports need entries that can be reviewed. I am the solo developer, responsible for the Android implementation, supporting services, verification work, and beta-readiness checklist."
              - paragraph [ref=f3e360]: The scope includes GPS trip capture, business or personal classification, multiple vehicles, annual odometer records, expense and receipt capture, and PDF/CSV reporting. The aim is useful Canadian mileage recordkeeping, with incomplete entries and release limitations kept visible.
          - region [ref=f3e361]:
            - 'heading "Architecture: screens through use cases to storage" [level=2] [ref=f3e363]'
            - paragraph [ref=f3e365]: Jetpack Compose screens receive StateFlow state from Hilt-injected view models. Use cases and repository interfaces separate business behavior from Room, DataStore, and Firebase implementations. Room owns local records; optional synchronization goes through an outbox rather than direct screen-to-cloud writes.
          - region [ref=f3e366]:
            - heading "Durability before connectivity" [level=2] [ref=f3e368]
            - paragraph [ref=f3e370]: Tracking checkpoints the active session, then buffers a completed trip before persistence. WorkManager retries local writes independently of network access; cloud synchronization requires connectivity and consent. Keeping those paths separate supports recovery when a drive or connection is interrupted.
          - region [ref=f3e371]:
            - heading "The application in the recordings" [level=2] [ref=f3e373]
            - generic [ref=f3e374]:
              - paragraph [ref=f3e375]: The five recordings on this page show the dashboard, automatically captured trips awaiting classification, the trip-detail form, manual tracking controls, vehicle settings, and reports. On the Trips screen, swipe left or right to classify a trip as business or personal, or select it to edit its details in a form. Captions and written descriptions explain each recording.
              - list [ref=f3e376]:
                - listitem [ref=f3e377]: The overview shows a suggested trip classification and editable fields.
                - listitem [ref=f3e378]: The Trips screen lists automatically captured, unclassified trips; selecting a trip opens its editable details and classification controls.
                - listitem [ref=f3e379]: The tracking clip shows controls in their ready state; it does not demonstrate a completed drive.
                - listitem [ref=f3e380]: Vehicle and report clips show their respective screens, rather than proving every background or export path.
          - region [ref=f3e381]:
            - heading "Verification and the remaining release work" [level=2] [ref=f3e383]
            - generic [ref=f3e384]:
              - paragraph [ref=f3e385]: The project includes unit and Android UI coverage for validation, interrupted-trip recovery, synchronization, authentication, exports, and core screens. A beta checklist distinguishes implementation evidence from device smoke tests and release approval.
